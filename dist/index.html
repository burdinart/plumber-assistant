<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="Профессиональные инструменты для сантехников: калькуляторы, справочники, CRM" />
    
    <!-- PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Сантехник" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/plumber-assistant/icon-192x192.svg" />
    <link rel="apple-touch-icon" href="/plumber-assistant/icon-192x192.svg" />
    
    <title>Помощник Сантехника</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      
      /* Prevent pull-to-refresh on mobile */
      body {
        overscroll-behavior-y: contain;
      }
    </style>
    <script>
      // Инициализация темы до загрузки React для предотвращения мерцания
      (function() {
        try {
          const stored = localStorage.getItem('plumber-assistant-settings');
          if (stored) {
            const settings = JSON.parse(stored);
            if (settings.state && settings.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          console.error('Error initializing theme:', e);
        }
      })();
    </script>
    <script type="module" crossorigin src="/plumber-assistant/assets/index-DiH8xVYp.js"></script>

  <body>
    <div id="root"></div>
  </body>
</html>
